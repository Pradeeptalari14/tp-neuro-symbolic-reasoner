name: SRE & Algorithmic Validation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SRE Validation Drill
        run: |
          chmod +x scripts/validate.sh
          bash scripts/validate.sh

      - name: Verify Architecture Assets in Docs
        run: |
          test -f docs/neuro_symbolic_flow.png
          echo "Architecture asset verified."
