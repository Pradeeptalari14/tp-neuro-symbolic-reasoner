apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuro-symbolic-prover
  labels:
    app: neuro-symbolic-prover
    domain: synthetic-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neuro-symbolic-prover
  template:
    metadata:
      labels:
        app: neuro-symbolic-prover
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: prover-engine
          image: ghcr.io/pradeeptalari14/tp-neuro-symbolic-reasoner:latest
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: neuro-symbolic-service
spec:
  selector:
    app: neuro-symbolic-prover
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
